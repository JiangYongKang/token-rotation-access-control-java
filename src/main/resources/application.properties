# 随机端口，便于本地并行运行测试
server.port=0

# ===== 本地身份与访问控制配置（app.security.*）=====
# 访问令牌有效期（秒），默认 15 分钟
app.security.access-ttl-seconds=900
# 刷新令牌有效期（秒），默认 14 天
app.security.refresh-ttl-seconds=1209600
# 初始签名密钥种子（仅本地演示；密钥轮换后使用随机新密钥）
app.security.key-seed=local-demo-master-key
# 令牌签发者
app.security.issuer=local-token-service
# 密钥轮换后是否保留旧版本密钥用于解释性校验；
# false（默认）：旧密钥立即从内存丢弃，旧令牌验签失败，reason=signing_key_retired
# true：旧密钥保留，凭令牌内嵌 kid 判定已轮换（仍拒绝，仅影响拒绝原因来源）
app.security.keep-retired-keys=false

logging.level.com.github.highcumontoa=INFO
