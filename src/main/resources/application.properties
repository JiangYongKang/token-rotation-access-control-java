server.port=8080

# --- Local identity & access control service configuration ---
# Token lifetimes
app.security.access-token-ttl-seconds=300
app.security.refresh-token-ttl-seconds=3600
# Token issuer claim carried by the service
app.security.issuer=local-iac-service
# Master secret from which HMAC signing keys are derived (local demo value; override in real use)
app.security.master-secret=local-development-master-secret-change-me
# Id of the initial signing key; rotating creates a new id and drops the old one
app.security.initial-key-id=k1
# Static salt for the demo SHA-256 password hashing
app.security.password-salt=local-static-salt

logging.level.com.github.highcumontoa=INFO
# Grace window after a rotation during which a late duplicate of the just-used refresh token is
# treated as a concurrent loser instead of a replay attacker (no revocation)
app.security.refresh-grace-millis=1000
